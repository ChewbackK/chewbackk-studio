name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # Pages, accessibilité (axe), hero, menu mobile, formulaire, poids JS.
      - name: Tests (Playwright)
        run: npm test

      - name: Rapport des tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
